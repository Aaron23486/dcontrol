# Producción o demostración completa: PostgreSQL + la app (API que sirve la web).
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Variables necesarias en .env: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, JWT_SECRET,
# WEB_ORIGIN (la URL pública), CEDI_TIMEZONE. Detrás de un proxy HTTPS: TRUST_PROXY=true.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    volumes:
      - db-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      WEB_ORIGIN: ${WEB_ORIGIN:?Define WEB_ORIGIN en .env}
      CEDI_TIMEZONE: ${CEDI_TIMEZONE:?Define CEDI_TIMEZONE en .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - '${APP_PORT:-8080}:3000'

volumes:
  db-data-prod:
