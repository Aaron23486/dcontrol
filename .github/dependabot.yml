# SEC-11: Dependabot propone actualizaciones como pull requests; ninguna se aplica sola.
# Cada PR pasa por el CI completo y se revisa antes de unirlo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # NestJS se actualiza entero: sus paquetes comparten versión mayor y por separado
      # la API no arranca (PR #13). Va primero porque cada paquete entra en el primer grupo que coincide.
      nestjs:
        patterns: ['@nestjs/*']
      # Parches y versiones menores juntos; cada versión mayor llega en su propio PR.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Los tipos siguen la versión mayor de Node que usan la app y el CI (22); se sube a mano con Node (PR #11).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
