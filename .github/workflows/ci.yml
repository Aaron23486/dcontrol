name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el workflow solo lee el repositorio (SEC-11).
permissions:
  contents: read

jobs:
  # SEC-11: dependencias con vulnerabilidades conocidas y secretos en el historial.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial, para el escaneo de secretos
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Falla con vulnerabilidades altas o críticas (de producción o de desarrollo).
      - run: npm audit --audit-level=high
      - name: Escaneo de secretos (gitleaks, todo el historial)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner

  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cedi
          POSTGRES_PASSWORD: cedi-ci
          POSTGRES_DB: cedi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cedi -d cedi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Valores solo para CI; no son secretos reales.
      NODE_ENV: test
      DATABASE_URL: postgresql://cedi:cedi-ci@localhost:5432/cedi
      DATABASE_URL_TEST: postgresql://cedi:cedi-ci@localhost:5432/cedi_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-000000
      WEB_ORIGIN: http://localhost:5173
      CEDI_TIMEZONE: America/Mexico_City
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Unitarias + integración (PostgreSQL real) con umbrales mínimos de cobertura.
      - run: npm run test:coverage
      # El job usa NODE_ENV=test; el build se comprueba como el de producción (React en modo producción).
      - run: npm run build
        env:
          NODE_ENV: production
      # La imagen de producción debe seguir construyéndose (ADR 0010).
      - run: docker build -t cedi-control:ci .
      # E2E del flujo de la caseta en Chromium (levanta su propia API y web).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
