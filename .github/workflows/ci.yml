name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cedi
          POSTGRES_PASSWORD: cedi-ci
          POSTGRES_DB: cedi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cedi -d cedi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Valores solo para CI; no son secretos reales.
      NODE_ENV: test
      DATABASE_URL: postgresql://cedi:cedi-ci@localhost:5432/cedi
      DATABASE_URL_TEST: postgresql://cedi:cedi-ci@localhost:5432/cedi_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-000000
      WEB_ORIGIN: http://localhost:5173
      CEDI_TIMEZONE: America/Mexico_City
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Unitarias + integración (PostgreSQL real) con umbrales mínimos de cobertura.
      - run: npm run test:coverage
      - run: npm run build
      # La imagen de producción debe seguir construyéndose (ADR 0010).
      - run: docker build -t cedi-control:ci .
      # E2E del flujo de la caseta en Chromium (levanta su propia API y web).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
